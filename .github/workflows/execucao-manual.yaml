#nome da pipeline
name: 'Execucao manual-Fluxo cadastro aluno e entrega de trabalho'
#regras de disparos
on:
  workflow_dispatch:
#jobs = tarefas que serão rodadas dentro da pipe
jobs:
  #nome do job
  e2e-tests:
    #maquina que vai rodar
    runs-on: ubuntu-latest

    #configurações do ambiente do arquivo env que foi configurado no github
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_SENHA: ${{ secrets.ADMIN_SENHA }}

    #passos do job
    steps:
      #clonar o projeto
      - uses: actions/checkout@v4
      #instalação do node
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      #instalação das dependencias necessarias para rodar o projeto
      - name: Instalando dependências
        run: npm install
      
      #iniciando a API e deixando em segundo plano com o &
      - name: Iniciar a API para os testes
        run: npm start &
      
      #Aguardando a API ficar on
      - name: Aguardando a API subir
        run: npm run wait-api

      #execução dos testes
      - name: Executando os testes
        run: npm run testPipe
