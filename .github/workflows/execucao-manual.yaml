#nome da pipeline
name: 'Execucao manual-Fluxo cadastro aluno e entrega de trabalho'
#regras de disparos
on:
  workflow_dispatch:
#jobs = tarefas que serão rodadas dentro da pipe
jobs:
  #nome do job
  e2e-tests:
    #maquina que vai rodar
    runs-on: ubuntu-latest
    #passos do job
    steps:
      #clonar o projeto
      - uses: actions/checkout@v4
      #instalação do node
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      #instalação das dependencias necessarias para rodar o projeto
      - name: Instalando dependências
        run: npm install
      #execução dos testes
      - name: Executando os testes
        run: npm run testPipe
